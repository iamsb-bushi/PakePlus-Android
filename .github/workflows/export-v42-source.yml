name: Export reconstructed v4.2 source

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore v4.2 source
        shell: bash
        run: |
          set -euo pipefail
          cat .v3src/part* > /tmp/v3.b64
          base64 -d /tmp/v3.b64 > /tmp/v3.zip
          rm -rf chatgpt-local-api /tmp/v3src && mkdir -p /tmp/v3src
          unzip -q /tmp/v3.zip -d /tmp/v3src
          mv /tmp/v3src/chat-web-agent-v3 chatgpt-local-api
          cp .v3patch/Diagnostics.java chatgpt-local-api/app/src/main/java/com/example/chatgptlocalapi/Diagnostics.java
          chmod +x .v3patch/fix-agent.sh .v3patch/fix-local-api.sh
          .v3patch/fix-agent.sh
          .v3patch/fix-local-api.sh
          cat .v4patch/part* > /tmp/v4.b64
          base64 -d /tmp/v4.b64 > /tmp/v4.gz
          gzip -dc /tmp/v4.gz > /tmp/v4.patch
          git apply -p2 /tmp/v4.patch
          base64 -d .v41patch/patch.b64 > /tmp/v41.gz
          gzip -dc /tmp/v41.gz > /tmp/v41.patch
          git apply --directory=chatgpt-local-api /tmp/v41.patch
          base64 -d .v42patch/patch.b64 > /tmp/v42.gz
          gzip -dc /tmp/v42.gz > /tmp/v42.patch
          git apply --directory=chatgpt-local-api /tmp/v42.patch
          tar -czf /tmp/chatgpt-local-api-v42-source.tgz chatgpt-local-api
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-local-api-v42-source
          path: /tmp/chatgpt-local-api-v42-source.tgz
          retention-days: 1
