name: Build ChatGPT Local API APK

on:
  push:
    branches:
      - chatgpt-local-api-android
    paths:
      - 'chatgpt-local-api/**'
      - '.github/workflows/chatgpt-local-api.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chatgpt-local-api/**'
      - '.github/workflows/chatgpt-local-api.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew -p chatgpt-local-api :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Local-API-debug
          path: chatgpt-local-api/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
