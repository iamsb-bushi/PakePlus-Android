name: Build Chat Web Agent API APK

on:
  push:
    branches:
      - chatgpt-local-api-android
    paths:
      - '.v3src/**'
      - '.v3patch/**'
      - '.github/workflows/chatgpt-local-api.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.v3src/**'
      - '.v3patch/**'
      - '.github/workflows/chatgpt-local-api.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Chat Web Agent v3 source
        run: |
          cat .v3src/part* > /tmp/chat-web-agent-v3.b64
          base64 -d /tmp/chat-web-agent-v3.b64 > /tmp/chat-web-agent-v3.zip
          unzip -t /tmp/chat-web-agent-v3.zip
          rm -rf chatgpt-local-api
          rm -rf /tmp/chat-web-agent-v3-src
          mkdir -p /tmp/chat-web-agent-v3-src
          unzip -q /tmp/chat-web-agent-v3.zip -d /tmp/chat-web-agent-v3-src
          mv /tmp/chat-web-agent-v3-src/chat-web-agent-v3 chatgpt-local-api
          cp .v3patch/Diagnostics.java chatgpt-local-api/app/src/main/java/com/example/chatgptlocalapi/Diagnostics.java
          chmod +x .v3patch/fix-agent.sh .v3patch/fix-local-api.sh
          .v3patch/fix-agent.sh
          .v3patch/fix-local-api.sh
          grep -q '3.0.0-agent' chatgpt-local-api/app/build.gradle
          grep -q 'class AgentProtocol' chatgpt-local-api/app/src/main/java/com/example/chatgptlocalapi/AgentProtocol.java
          grep -q 'buildChatPrompt(JSONObject req) throws Exception' chatgpt-local-api/app/src/main/java/com/example/chatgptlocalapi/AgentProtocol.java
          grep -q 'sendChatJson(OutputStream out, String id, long now, AgentProtocol.ParsedReply reply) throws Exception' chatgpt-local-api/app/src/main/java/com/example/chatgptlocalapi/LocalApiService.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew -p chatgpt-local-api :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Web-Agent-API-v3-debug
          path: chatgpt-local-api/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
