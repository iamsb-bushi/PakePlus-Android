name: Build Chat Web Agent API v4 APK

on:
  push:
    branches:
      - chatgpt-local-api-android
    paths:
      - '.v4src/**'
      - '.github/workflows/chatgpt-local-api.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.v4src/**'
      - '.github/workflows/chatgpt-local-api.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v4 source
        run: |
          rm -rf chatgpt-local-api
          mkdir chatgpt-local-api
          unzip -q .v4src/chat-web-agent-v4-src.zip -d chatgpt-local-api
          grep -q "4.0.0-agent-local" chatgpt-local-api/app/build.gradle
          grep -q "class WebSessionManager" chatgpt-local-api/app/src/main/java/com/example/chatgptlocalapi/WebSessionManager.java
          grep -q "composer_detected" chatgpt-local-api/app/src/main/java/com/example/chatgptlocalapi/Diagnostics.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build unsigned release APK
        run: |
          chmod +x ./gradlew
          ./gradlew -p chatgpt-local-api :app:assembleRelease --stacktrace
          ls -lah chatgpt-local-api/app/build/outputs/apk/release/

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Web-Agent-API-v4-unsigned
          path: chatgpt-local-api/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
